<!doctype html>
<html class="night-mode" dir="ltr" data-bs-theme="dark">
  <head>
    <title>previewer</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="./reviewer.css">
    <link rel="stylesheet" href="./webview.css">
    <style>
    body {
      zoom: 1;
      background-color: var(--canvas);
    }
    html {
      font-family: "Sans Serif", sans-serif;
    }

    /* Buttons */
    button {
      font-family: "Sans Serif", sans-serif;
    }
    /* Input field focus outline */
    textarea:focus,
    input:focus,
    input[type]:focus,
    .uneditable-input:focus,
    div[contenteditable="true"]:focus {
      outline: 0 none;
      border-color: #3b82f6;
    }
    :root {
      --canvas: #f5f5f5;
    }
    :root[class*="night-mode"] {
      --canvas: #2c2c2c;
    }

    </style>

    <link rel="stylesheet" href="./anki.css" />
  </head>

  <body class="card isLin night_mode reduce-motion fancy">
    <div id="_mark" hidden>&#x2605;</div>
    <div id="_flag" hidden>&#x2691;</div>
    <div id="qa">
      <kiku-host-anki side="front"></kiku-host-anki>
      <div id="kiku-root" part="root">
      </div>
    </div>

    <script type="module">
      import "#/src/index.tsx";

      const params = new URLSearchParams(window.location.search);
      const side = (params.get("side") || "back");
      document.querySelector("kiku-host-anki").setAttribute("side", side);

    </script>
  </body>
</html>
